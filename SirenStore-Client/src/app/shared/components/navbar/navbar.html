<nav class="bg-white/80 backdrop-blur-md border-b border-gray-100 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <!-- Logo -->
      <div class="flex-shrink-0 flex items-center cursor-pointer" routerLink="/">
        <span class="text-2xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent tracking-tight">SirenStore</span>
      </div>

      <!-- Center Links -->
      <div class="hidden md:flex space-x-8 items-center">
        <a routerLink="/products" class="text-gray-600 hover:text-indigo-600 px-3 py-2 text-sm font-medium transition-colors">Ürünler</a>
        
        <!-- Kategoriler Dropdown -->
        <div class="relative group">
          <button class="text-gray-600 hover:text-indigo-600 px-3 py-2 text-sm font-medium transition-colors flex items-center gap-1 focus:outline-none cursor-pointer">
            Kategoriler
            <svg class="w-4 h-4 text-gray-400 group-hover:text-indigo-600 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </button>
          
          <!-- Dropdown Menu -->
          <div class="absolute left-0 mt-1 w-56 bg-white border border-gray-100 rounded-2xl shadow-xl py-2 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50">
            <a *ngFor="let category of categories"
               [routerLink]="['/products']"
               [queryParams]="{ categoryId: category.id }"
               class="block px-4 py-2.5 text-sm text-gray-700 hover:bg-indigo-50 hover:text-indigo-600 transition-colors">
              {{ category.name }}
            </a>
            <div class="border-t border-gray-100 my-1"></div>
            <a [routerLink]="['/products']"
               class="block px-4 py-2.5 text-sm text-gray-500 hover:bg-gray-50 hover:text-gray-700 transition-colors font-medium">
              Tüm Ürünler
            </a>
          </div>
        </div>
      </div>

      <!-- Right Actions -->
      <div class="flex items-center space-x-4">
        <!-- Sepet -->
        <button *ngIf="!hideCart" (click)="handleCartClick()" class="flex items-center gap-2 text-gray-600 hover:text-indigo-600 font-medium transition-colors p-2 rounded-xl hover:bg-gray-50 relative">
          <div class="relative">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
            </svg>
            <span *ngIf="basketService.basketCount() > 0" class="absolute -top-1 -right-2 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-white bg-red-500 rounded-full">{{ basketService.basketCount() }}</span>
          </div>
          <span class="text-sm">Sepetim</span>
        </button>

        <!-- Auth Actions -->
        <ng-container *ngIf="authService.isAuthenticated(); else loggedOut">
          <div class="flex items-center space-x-3 ml-4 pl-4 border-l border-gray-200">
            <!-- Satıcı Paneli Butonu -->
            <a *ngIf="authService.getCurrentUser()?.userType === UserTypes.Seller" routerLink="/seller-dashboard" class="inline-flex items-center justify-center px-4 py-2 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-violet-600 hover:bg-violet-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-violet-500 transition-all hover:scale-105 active:scale-95 mr-2">
              Satıcı Paneli
            </a>
            <!-- Admin Paneli Butonu -->
            <a *ngIf="authService.getCurrentUser()?.userType === UserTypes.Admin" routerLink="/admin-dashboard" class="inline-flex items-center justify-center px-4 py-2 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all hover:scale-105 active:scale-95 mr-2">
              Admin Paneli
            </a>


            <div class="hidden sm:flex flex-col items-end cursor-pointer group" routerLink="/profile" title="Profilim ve Siparişlerim">
              <span class="text-sm font-semibold text-gray-900 group-hover:text-indigo-600 transition-colors flex items-center gap-1">
                {{ authService.getCurrentUser()?.firstName }} {{ authService.getCurrentUser()?.lastName }}
                <svg class="w-4 h-4 text-gray-400 group-hover:text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
              </span>
              <span class="text-xs text-gray-500 group-hover:text-indigo-400 transition-colors">Profilim & Siparişlerim</span>
            </div>
            <button (click)="logout()" class="ml-2 inline-flex items-center justify-center px-4 py-2 border border-transparent rounded-xl shadow-sm text-sm font-medium text-red-600 bg-red-50 hover:bg-red-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition-all">
              Çıkış
            </button>
          </div>
        </ng-container>

        <ng-template #loggedOut>
          <div class="flex items-center space-x-3 ml-4 pl-4 border-l border-gray-200">
            <a *ngIf="!hideLogin" routerLink="/auth/login" 
               [ngClass]="hideRegister ? 'inline-flex items-center justify-center px-4 py-2 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all hover:scale-105 active:scale-95' : 'text-gray-600 hover:text-indigo-600 text-sm font-medium transition-colors'">
              Giriş Yap
            </a>
            <a *ngIf="!hideRegister" routerLink="/auth/register" class="inline-flex items-center justify-center px-4 py-2 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all hover:scale-105 active:scale-95">
              Kayıt Ol
            </a>
          </div>
        </ng-template>
      </div>
    </div>
  </div>
</nav>
