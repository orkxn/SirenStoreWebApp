<!-- Overlay — sadece açıkken göster -->
<div *ngIf="isOpen()" 
     (click)="closeCart()"
     class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 transition-opacity duration-300">
</div>

<!-- Offcanvas Panel — sadece açıkken göster -->
<div *ngIf="isOpen()"
     class="fixed inset-y-0 right-0 max-w-md w-full bg-white shadow-2xl z-50 flex flex-col animate-slide-in">
  
  <!-- Header -->
  <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-white">
    <h2 class="text-xl font-bold text-gray-900 flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
      </svg>
      Sepetim
      <span *ngIf="basketCount() > 0" class="bg-indigo-100 text-indigo-800 text-sm py-0.5 px-2.5 rounded-full ml-2">{{ basketCount() }}</span>
    </h2>
    <button (click)="closeCart()" class="text-gray-400 hover:text-gray-600 transition-colors p-2 rounded-full hover:bg-gray-100">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  </div>

  <!-- Cart Items (Scrollable) -->
  <div class="flex-1 overflow-y-auto p-6">
    <!-- Boş sepet -->
    <div *ngIf="!basket() || basket()?.items?.length === 0" class="h-full flex flex-col items-center justify-center text-center space-y-4">
      <div class="w-24 h-24 bg-gray-50 rounded-full flex items-center justify-center">
        <svg class="w-12 h-12 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
        </svg>
      </div>
      <p class="text-gray-500 font-medium">Sepetiniz şu an boş.</p>
      <button (click)="closeCart()" class="text-indigo-600 font-semibold hover:text-indigo-700">Alışverişe Başla</button>
    </div>

    <!-- Dolu sepet -->
    <ul *ngIf="basket() && (basket()?.items?.length ?? 0) > 0" class="divide-y divide-gray-100">
      <li *ngFor="let item of basket()?.items" class="py-4 flex gap-4">
        <!-- Ürün Görseli -->
        <div class="h-20 w-20 flex-shrink-0 overflow-hidden rounded-xl border border-gray-200 bg-gray-50">
          <img *ngIf="item.productImageUrl" [src]="item.productImageUrl" [alt]="item.productName" class="h-full w-full object-cover object-center">
          <div *ngIf="!item.productImageUrl" class="h-full w-full flex items-center justify-center">
            <svg class="w-8 h-8 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          </div>
        </div>

        <!-- Detaylar -->
        <div class="flex flex-1 flex-col">
          <div class="flex justify-between text-base font-medium text-gray-900">
            <h3 class="line-clamp-2 text-sm">{{ item.productName }}</h3>
            <p class="ml-4 whitespace-nowrap text-indigo-600">₺{{ item.price | number:'1.2-2' }}</p>
          </div>
          <div class="flex flex-1 items-end justify-between text-sm mt-2">
            <!-- Miktar -->
            <div class="flex items-center border border-gray-200 rounded-lg bg-white">
              <button (click)="updateQuantity(item.productId, item.quantity - 1)" class="w-8 h-8 flex items-center justify-center text-gray-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-l-lg transition-colors">−</button>
              <span class="w-8 text-center font-medium text-gray-900">{{ item.quantity }}</span>
              <button (click)="updateQuantity(item.productId, item.quantity + 1)" class="w-8 h-8 flex items-center justify-center text-gray-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-r-lg transition-colors">+</button>
            </div>
            <button type="button" (click)="removeItem(item.productId)" class="font-medium text-red-500 hover:text-red-600 flex items-center gap-1 transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
              Sil
            </button>
          </div>
        </div>
      </li>
    </ul>
  </div>

  <!-- Footer -->
  <div *ngIf="basket() && (basket()?.items?.length ?? 0) > 0" class="border-t border-gray-100 px-6 py-6 bg-gray-50">
    <div class="flex justify-between text-base font-medium text-gray-900 mb-4">
      <p>Ara Toplam</p>
      <p class="text-xl text-indigo-600 font-bold">₺{{ basketTotal() | number:'1.2-2' }}</p>
    </div>
    <p class="text-sm text-gray-500 mb-6">Kargo ve vergiler ödeme adımında hesaplanır.</p>
    <button (click)="closeCart()" class="w-full flex items-center justify-center rounded-xl border border-transparent bg-indigo-600 px-6 py-4 text-base font-medium text-white shadow-sm hover:bg-indigo-700 hover:shadow-lg transition-all active:scale-[0.98]">
      Siparişi Tamamla
    </button>
    <div class="mt-4 flex justify-center text-center text-sm text-gray-500">
      <p>
        veya
        <button type="button" (click)="closeCart()" class="font-medium text-indigo-600 hover:text-indigo-500 ml-1">
          Alışverişe Devam Et <span aria-hidden="true"> &rarr;</span>
        </button>
      </p>
    </div>
  </div>
</div>
