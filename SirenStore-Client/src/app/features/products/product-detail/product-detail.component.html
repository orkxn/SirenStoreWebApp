<div class="min-h-screen bg-slate-50 py-12">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    
    <!-- Geri Dön Linki -->
    <div class="mb-8">
      <a routerLink="/products" class="inline-flex items-center text-sm font-medium text-gray-500 hover:text-indigo-600 transition-colors">
        <svg class="mr-2 h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Ürünlere Dön
      </a>
    </div>

    <!-- Yükleniyor -->
    <div *ngIf="isLoading" class="flex justify-center items-center py-20">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
    </div>

    <!-- Hata Mesajı -->
    <div *ngIf="errorMessage && !isLoading" class="bg-red-50 p-4 rounded-xl text-center">
      <p class="text-red-600 font-medium">{{ errorMessage }}</p>
    </div>

    <!-- Ürün Detayları -->
    <div *ngIf="product && !isLoading && !errorMessage" class="bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden">
      <div class="lg:grid lg:grid-cols-2 lg:gap-x-8">
        
        <!-- Ürün Görseli -->
        <div class="aspect-w-1 aspect-h-1 sm:overflow-hidden lg:aspect-none lg:h-full bg-gray-100 p-8 flex items-center justify-center">
          <img *ngIf="product.mainImageUrl"
               [src]="product.mainImageUrl"
               [alt]="product.name" class="object-contain object-center rounded-2xl w-full h-full max-h-[500px]">
          
          <div *ngIf="!product.mainImageUrl" class="w-full h-full min-h-[400px] flex items-center justify-center">
            <svg class="w-24 h-24 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
            </svg>
          </div>
        </div>

        <!-- Ürün Bilgileri -->
        <div class="p-8 sm:p-10 lg:p-12 flex flex-col">
          <h1 class="text-3xl font-extrabold text-gray-900 sm:text-4xl tracking-tight">{{ product.name }}</h1>
          
          <div class="mt-4 flex items-center justify-between">
            <p class="text-3xl font-bold text-indigo-600">₺{{ product.price | number:'1.2-2' }}</p>
            <div class="flex items-center">
              <div class="flex items-center text-yellow-400">
                <svg class="h-5 w-5 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" /></svg>
                <svg class="h-5 w-5 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" /></svg>
                <svg class="h-5 w-5 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" /></svg>
                <svg class="h-5 w-5 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" /></svg>
                <svg class="h-5 w-5 text-gray-300 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" /></svg>
              </div>
              <span class="ml-2 text-sm text-gray-500">24 Yorum</span>
            </div>
          </div>

          <div class="mt-6 flex-grow">
            <h3 class="sr-only">Açıklama</h3>
            <div class="text-base text-gray-700 space-y-6">
              <p>{{ product.description || 'Bu ürün için detaylı bir açıklama bulunmuyor.' }}</p>
            </div>
          </div>

          <div class="mt-8 border-t border-gray-100 pt-8">
            <div class="flex items-center space-x-4">
              <!-- Miktar Ayarlayıcı -->
              <div class="flex items-center border border-gray-300 rounded-xl bg-white shadow-sm">
                <button type="button" (click)="decreaseQuantity()" class="p-3 text-gray-500 hover:text-indigo-600 transition-colors rounded-l-xl hover:bg-gray-50 focus:outline-none">
                  <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4" /></svg>
                </button>
                <span class="px-6 py-2 text-gray-900 font-semibold">{{ quantity }}</span>
                <button type="button" (click)="increaseQuantity()" class="p-3 text-gray-500 hover:text-indigo-600 transition-colors rounded-r-xl hover:bg-gray-50 focus:outline-none">
                  <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                </button>
              </div>

              <!-- Sepete Ekle Butonu -->
              <button type="button" (click)="addToCart()"
                      [ngClass]="{'bg-green-500 hover:bg-green-600': isAddingToCart, 'bg-indigo-600 hover:bg-indigo-700': !isAddingToCart}"
                      class="flex-1 flex items-center justify-center px-8 py-4 border border-transparent rounded-xl shadow-md text-base font-bold text-white focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all hover:shadow-lg hover:-translate-y-0.5">
                <svg *ngIf="!isAddingToCart" class="mr-2 h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                </svg>
                <svg *ngIf="isAddingToCart" class="mr-2 h-5 w-5 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                {{ isAddingToCart ? 'Ekleniyor...' : 'Sepete Ekle' }}
              </button>
            </div>
            <div *ngIf="!authService.isAuthenticated()" class="mt-3 text-center text-sm text-red-500 font-medium flex items-center justify-center bg-red-50 py-2 rounded-lg">
              <svg class="h-4 w-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
              Sepete eklemek için giriş yapmalısınız.
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
