<div class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-gray-100 p-8 space-y-6">

        <div class="text-center">
            <h2 class="text-3xl font-black text-indigo-600 tracking-tight">SirenStore</h2>
            <p class="text-sm text-gray-500 mt-1">Hesabınıza giriş yapın</p>
        </div>

        <div *ngIf="errorMessage"
            class="bg-red-50 border-l-4 border-red-500 p-4 rounded-r-lg text-sm text-red-700 animate-pulse">
            {{ errorMessage }}
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">

            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">E-Posta
                    Adresi</label>
                <input type="email" formControlName="email" placeholder="orkun@example.com"
                    class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-gray-900 placeholder-gray-400 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition duration-200 text-sm"
                    [ngClass]="{'border-red-500 focus:ring-red-100': loginForm.get('email')?.touched && loginForm.get('email')?.invalid}" />
                <span *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
                    class="text-xs text-red-500 mt-1 block">
                    Geçerli bir e-posta adresi giriniz.
                </span>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Şifre</label>
                <input type="password" formControlName="password" placeholder="••••••••"
                    class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-gray-900 placeholder-gray-400 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition duration-200 text-sm"
                    [ngClass]="{'border-red-500 focus:ring-red-100': loginForm.get('password')?.touched && loginForm.get('password')?.invalid}" />
                <span *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
                    class="text-xs text-red-500 mt-1 block">
                    Şifre en az 6 karakter olmalıdır.
                </span>
            </div>

            <button type="submit" [disabled]="isLoading"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-md hover:shadow-lg transition duration-200 flex items-center justify-center space-x-2 text-sm disabled:bg-indigo-400 disabled:cursor-not-allowed">
                <span *ngIf="!isLoading">Giriş Yap</span>
                <span *ngIf="isLoading" class="flex items-center space-x-2">
                    <svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                    <span>Giriş Yapılıyor...</span>
                </span>
            </button>

        </form>

        <div class="text-center pt-2">
            <p class="text-xs text-gray-500">
                Henüz hesabınız yok mu?
                <a routerLink="/auth/register"
                    class="text-indigo-600 hover:text-indigo-700 font-bold hover:underline transition ml-1">Kayıt Ol</a>
            </p>
        </div>

    </div>
</div>
