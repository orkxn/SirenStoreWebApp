<div class="min-h-screen bg-slate-50 flex flex-col bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-blend-multiply">
  
  <app-navbar [hideCart]="true" [hideRegister]="true"></app-navbar>

  <div class="flex-1 flex flex-col justify-center relative pb-12">

    <div class="sm:mx-auto sm:w-full sm:max-w-md shrink-0">
      <!-- Logo placeholder -->
      <div class="flex justify-center text-indigo-600">
        <svg class="h-8 w-8 sm:h-10 sm:w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
        </svg>
      </div>
      <h2 class="mt-2 mb-4 text-center text-2xl font-extrabold text-gray-900 tracking-tight sm:text-3xl">Hesap Oluştur</h2>
    </div>

  <div class="mt-4 sm:mx-auto sm:w-full sm:max-w-md px-4 sm:px-0">
    <div class="bg-white/80 backdrop-blur-xl py-6 px-4 shadow-2xl sm:rounded-2xl sm:px-8 border border-white/50">
      
      <!-- Hata / Başarı Mesajları -->
      <div *ngIf="errorMessage" class="mb-3 rounded-xl bg-red-50 p-3 border border-red-100">
        <div class="flex">
          <div class="flex-shrink-0">
            <svg class="h-4 w-4 text-red-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
            </svg>
          </div>
          <div class="ml-2">
            <h3 class="text-xs font-medium text-red-800">{{ errorMessage }}</h3>
          </div>
        </div>
      </div>

      <div *ngIf="successMessage" class="mb-3 rounded-xl bg-green-50 p-3 border border-green-100">
        <div class="flex">
          <div class="flex-shrink-0">
            <svg class="h-4 w-4 text-green-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
            </svg>
          </div>
          <div class="ml-2">
            <h3 class="text-xs font-medium text-green-800">{{ successMessage }}</h3>
          </div>
        </div>
      </div>

      <form class="space-y-4" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="grid grid-cols-2 gap-3">
          <!-- Ad -->
          <div>
            <label for="firstName" class="block text-xs font-semibold text-gray-700">Ad</label>
            <div class="mt-1">
              <input id="firstName" formControlName="firstName" type="text" autocomplete="given-name" required
                class="appearance-none block w-full px-3 py-1.5 border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 text-sm transition-shadow">
            </div>
            <div *ngIf="registerForm.get('firstName')?.invalid && registerForm.get('firstName')?.touched" class="mt-1 text-[10px] text-red-500">
              Ad gereklidir.
            </div>
          </div>

          <!-- Soyad -->
          <div>
            <label for="lastName" class="block text-xs font-semibold text-gray-700">Soyad</label>
            <div class="mt-1">
              <input id="lastName" formControlName="lastName" type="text" autocomplete="family-name" required
                class="appearance-none block w-full px-3 py-1.5 border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 text-sm transition-shadow">
            </div>
            <div *ngIf="registerForm.get('lastName')?.invalid && registerForm.get('lastName')?.touched" class="mt-1 text-[10px] text-red-500">
              Soyad gereklidir.
            </div>
          </div>
        </div>

        <!-- E-posta -->
        <div>
          <label for="email" class="block text-xs font-semibold text-gray-700">E-posta adresi</label>
          <div class="mt-1">
            <input id="email" formControlName="email" type="email" autocomplete="email" required
              class="appearance-none block w-full px-3 py-1.5 border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 text-sm transition-shadow">
          </div>
          <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" class="mt-1 text-[10px] text-red-500">
            Geçerli bir e-posta giriniz.
          </div>
        </div>

        <!-- Telefon Numarası -->
        <div>
          <label for="phoneNumber" class="block text-xs font-semibold text-gray-700">Telefon Numarası (İsteğe Bağlı)</label>
          <div class="mt-1">
            <input id="phoneNumber" formControlName="phoneNumber" type="tel" autocomplete="tel" placeholder="05XX XXX XX XX"
              class="appearance-none block w-full px-3 py-1.5 border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 text-sm transition-shadow">
          </div>
        </div>

        <!-- Şifre -->
        <div>
          <label for="password" class="block text-xs font-semibold text-gray-700">Şifre</label>
          <div class="mt-1">
            <input id="password" formControlName="password" type="password" autocomplete="new-password" required
              class="appearance-none block w-full px-3 py-1.5 border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 text-sm transition-shadow">
          </div>
          <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" class="mt-1 text-[10px] text-red-500">
            Şifre en az 6 karakter olmalıdır.
          </div>
        </div>

        <div class="pt-2">
          <button type="submit" [disabled]="isLoading"
            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all hover:scale-[1.02] active:scale-[0.98] disabled:opacity-70 disabled:cursor-not-allowed">
            <span *ngIf="isLoading" class="mr-2">
              <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
            </span>
            Kayıt Ol
          </button>
        </div>
      </form>

    </div>
  </div>
</div>
</div>
